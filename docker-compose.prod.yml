# Get Secure CRM — production stack for a single VPS (Hostinger KVM or any Docker host).
#
#   cp deploy/env.example .env     # then fill it in; .env stays on the server, never in git
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Three containers: the app, PostgreSQL, and Caddy for HTTPS. Postgres is reachable only on the
# internal compose network — it is never published to the internet. The app runs as exactly one
# container because it holds the IMAP connection to Titan; do not scale `web`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: getsecure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: getsecure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getsecure -d getsecure"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Migrations run automatically on start (scripts/start.sh).
      DATABASE_URL: postgres://getsecure:${POSTGRES_PASSWORD}@db:5432/getsecure
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Pacific/Auckland}
      # The IMAP watcher lives in this process. Exactly one container may have this on.
      INGEST_IN_PROCESS: "true"
      # Backstop only. New mail arrives via IMAP IDLE (the server pushes), so this poll just
      # re-checks for anything IDLE missed. Each poll is one cheap SEARCH, not a re-download.
      INGEST_POLL_SECONDS: ${INGEST_POLL_SECONDS:-300}
      # Voice recordings. PLAUD_ENABLED=true turns the Plaud sync on; the CLI and its token are
      # mounted from the host (see scripts/plaud-login.sh).
      PLAUD_ENABLED: ${PLAUD_ENABLED:-false}
      PLAUD_CLI: /opt/plaud-cli/node_modules/.bin/plaud
      # Mail from these addresses is always a website enquiry: parsed exactly, never filtered as
      # automated junk, never sent to a classifier. Comma-separated.
      LEAD_SENDER_ADDRESSES: ${LEAD_SENDER_ADDRESSES:-}
      # Built-in offline classifier: no external AI service, no API key, no per-email cost.
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AI_LEAD_CONFIDENCE_THRESHOLD: ${AI_LEAD_CONFIDENCE_THRESHOLD:-0.75}
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-}
    expose:
      - "3000"
    volumes:
      # The CLI itself never changes, so it is read-only.
      - /opt/plaud-cli:/opt/plaud-cli:ro
      # The token directory must be writable: Plaud's access token expires and the CLI rewrites
      # tokens.json when it refreshes. Mounted read-only, the sync would work until the first
      # refresh and then fail permanently.
      - /root/.plaud:/root/.plaud

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
